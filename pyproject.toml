[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-graphrag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.0",
    "typer[all]>=0.12",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "uvicorn>=0.34",
    "langchain-text-splitters>=0.3",
    "tiktoken>=0.7",
    "pgvector>=0.3",
    "requests>=2.31",
    "neo4j>=5.0",
    "leidenalg>=0.10",
    "python-igraph>=0.11",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "tomli-w>=1.0",
    "mcp>=1.2,<2.0",
]

[project.optional-dependencies]
# Heavy, CLI-only capability: converting binary documents (PDF/DOCX/PPTX) into
# markdown. Docling pulls in Torch/CUDA, so it is deliberately kept out of the
# base (server) install — the backend image installs the base package only.
prepare = [
    "docling>=2.0",
]

[project.scripts]
rag = "rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
