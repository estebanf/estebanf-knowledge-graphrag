services:
  postgres:
    image: paradedb/paradedb:latest
    container_name: rag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-1GB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
      POSTGRES_WORK_MEM: ${POSTGRES_WORK_MEM:-64MB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-100}
    # The ParadeDB image ignores the POSTGRES_* env vars above for tuning
    # (it bakes shared_buffers=128MB / max_connections=100 into its own
    # postgresql.conf). Pass every tuned setting as a -c server argument so it
    # actually applies; command-line args override postgresql.conf. The env
    # vars remain the single override surface. shared_preload_libraries MUST
    # keep ParadeDB's own libs (pg_search, pg_cron, pg_stat_statements) and
    # only append pg_prewarm — dropping the others breaks the image.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-64MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - shared_preload_libraries=pg_search,pg_cron,pg_stat_statements,pg_prewarm
      - -c
      - pg_prewarm.autoprewarm=on
    volumes:
      - ./data/postgres:/var/lib/postgresql
      - ./scripts/init/postgres:/docker-entrypoint-initdb.d:ro
    shm_size: 512m
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: rag-memgraph
    ports:
      - "${MEMGRAPH_BOLT_PORT:-7687}:7687"
      - "${MEMGRAPH_LAB_PORT:-3000}:3000"
    volumes:
      - ./data/memgraph:/var/lib/memgraph
    environment:
      MEMGRAPH: "--storage-snapshot-interval-sec=300 --storage-wal-enabled=true --memory-limit=${MEMGRAPH_MEMORY_LIMIT:-2048}"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 7687 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-backend
    env_file:
      - .env
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rag}
      MEMGRAPH_URL: bolt://memgraph:7687
      STORAGE_BASE_PATH: /data/documents
      RAG_DATA_DIR: /data
      RAG_API_KEYS_PATH: /data/api_keys.toml
      RAG_WORKER_LOG_DIR: /data/worker_logs
      RAG_UPLOAD_DIR: /data/uploads
      RAG_FRONTEND_ORIGIN: ${RAG_FRONTEND_ORIGIN:-http://localhost}
      RAG_COOKIE_SECURE: ${RAG_COOKIE_SECURE:-false}
    volumes:
      - ./data/documents:/data/documents
      - ./data/worker_logs:/data/worker_logs
      - ./data/uploads:/data/uploads
      - ./data/api_keys.toml:/data/api_keys.toml
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
